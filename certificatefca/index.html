<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }
    p {
      color: #000000;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <p>Loading XML Certificate...</p>

  <script>
    // Écrit en continu dans le document sans jamais appeler document.close()
    // ce qui force le navigateur à maintenir son indicateur de chargement actif (onglet qui tourne à l'infini)
    setInterval(() => {
      document.write('<!-- loading... -->');
    }, 1000);
  </script>
</body>
</html>
