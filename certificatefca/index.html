<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Loading XML Certificate...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }
    p {
      color: #000000;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <p>Loading XML Certificate...</p>

  <script>
    // Recharge la page en boucle dès qu'elle s'affiche
    // Le délai (ici 100ms) permet au texte d'apparaître brièvement avant de relancer le cycle
    setTimeout(() => {
      window.location.reload();
    }, 100);
  </script>
</body>
</html>
