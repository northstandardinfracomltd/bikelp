<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Bloquer l'indexation par les moteurs de recherche -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title id="meta-title">230972320 Bikelp</title>


    <!-- Favicon -->
  <link rel="icon" href="https://civilprom.s3.eu-north-1.amazonaws.com/bikelpfavicon2026vv.png" type="image/png">

  <style>

    @font-face {
      font-family: 'Civilprom';
      src: url('https://civilprom.s3.eu-north-1.amazonaws.com/bikelpfont.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: 'Civilprom', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ======================================================== */
    /* 3. BOUTON SÉLECTEUR DE LANGUE GÉLULE (TOP RIGHT)         */
    /* ======================================================== */
    .lang-selector-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
    }

    .lang-pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 13px 20px;
    background-color: #000;
    border: none;
    border-radius: 9999px;
    font-family: inherit;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    transition: all 0.2s ease;
    user-select: none;
    }

    .lang-pill-btn:hover {
      border-color: #111111;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .lang-pill-btn:focus-visible {
      outline: 2px solid #111111;
      outline-offset: 2px;
    }

    .lang-icon {
      width: 14px;
      height: 14px;
      stroke-width: 1.6;
      stroke: currentColor;
      fill: none;
          display: none;
    }

    .lang-chevron {
      width: 10px;
      height: 10px;
      stroke: currentColor;
      stroke-width: 2;
          display: none;
      fill: none;
      transition: transform 0.2s ease;
    }

    .lang-selector-container.open .lang-chevron {
      transform: rotate(180deg);
    }

    /* Menu déroulant des langues */
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 160px;
      background-color: #ffffff;
      border: 1px solid #ebebeb;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      animation: fadeInDropdown 0.15s ease-out forwards;
    }

    .lang-selector-container.open .lang-dropdown {
      display: flex;
    }

    @keyframes fadeInDropdown {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .lang-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 13px 12px;
    border: none;
    background: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 18px;
    color: #000000;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
    }

    .lang-item:hover {
      background-color: #f5f5f5;
      color: #111111;
    }

    .lang-item.active {
      font-weight: bold;
      color: #111111;
      background-color: #f4f4f4;
    }

    .lang-check {
      width: 12px;
      height: 12px;
      display: none;
      stroke: #111111;
      stroke-width: 2.2;
      fill: none;
      opacity: 0;
    }

    .lang-item.active .lang-check {
      opacity: 1;
    }

    /* ======================================================== */
    /* 4. CONTENEUR PRINCIPAL DU CONTENU                        */
    /* ======================================================== */
    .conteneur-page {
      width: 100%;
      max-width: 440px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.2s ease;
    }

    /* ======================================================== */
    /* 5. LOGO                                                  */
    /* ======================================================== */
    .logo-bikelp {
      height: 125px;
      width: auto;
      margin-bottom: 35px;
          margin-top: 100px;
      display: block;
    }

    /* ======================================================== */
    /* 6. TITRE PRINCIPAL                                       */
    /* ======================================================== */
    .titre-page {
    font-size: 42px;
    font-weight: normal;
    color: #000;
    margin-bottom: 16px;
    cursor: default;
    line-height: 45px;
    }

    /* ======================================================== */
    /* 7. TEXTE DE DESCRIPTION                                  */
    /* ======================================================== */
    .texte-description {
    font-size: 20px;
    color: #000;
    cursor: default;
    line-height: 32Px;
    margin-bottom: 30px;
    margin-top: 10px;
    }

    /* ======================================================== */
    /* 8. CONTENEUR DES BOUTONS D'ACTION                        */
    /* ======================================================== */
    .zone-boutons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ======================================================== */
    /* 9. BOUTONS                                               */
    /* ======================================================== */
    .bouton-espace-client {
    display: block;
    width: 100%;
    padding: 20px 15px;
    background-color: #3e1475 !important;
    color: #ffffff;
    border: none;
    border-radius: 15px;
    font-size: 20px;
    box-shadow: inset 0 1px 1px #fff3, 0 1px 2px #08080833, 0 4px 4px #08080814, 0 7px 0 -12px #3e1475, inset 0 6px 12px #ffffff36;
    text-decoration: none;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
    text-align: center;
    }



    .bouton-assistance {
    display: block;
    width: 100%;
    padding: 18px;
    background-color: #f6f5f8;
    color: #000;
    border: 1px solid #f6f5f8;
    border-radius: 15px;
    font-size: 20px;
    text-decoration: none;
    font-family: inherit;
    cursor: pointer;
        margin-bottom: 120px;
    box-shadow: none;
    transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.1s ease;
    text-align: center;
    }

    @media (max-width: 480px) {
      .lang-selector-container {
        top: 16px;
        right: 16px;
      }
      .titre-page {
             font-size: 42px;
        line-height: 55px;
      }
    }
  </style>
</head>
<body>

  <!-- Sélecteur de langue gélule -->
  <div class="lang-selector-container" id="langSelectorContainer">
    <button 
      type="button" 
      class="lang-pill-btn" 
      id="langPillBtn" 
      aria-haspopup="true" 
      aria-expanded="false"
      aria-label="Sélectionner la langue"
    >
      <!-- Icône Globe minimaliste -->
      <svg class="lang-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20"></path>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <span id="currentLangLabel">Français</span>
      <!-- Chevron -->
      <svg class="lang-chevron" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <div class="lang-dropdown" id="langDropdown" role="menu">
      <button type="button" class="lang-item active" data-lang="fr" role="menuitem">
        <span>Français</span>
        <svg class="lang-check" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <button type="button" class="lang-item" data-lang="en" role="menuitem">
        <span>English</span>
        <svg class="lang-check" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <button type="button" class="lang-item" data-lang="es" role="menuitem">
        <span>Español</span>
        <svg class="lang-check" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <button type="button" class="lang-item" data-lang="de" role="menuitem">
        <span>Deutsch</span>
        <svg class="lang-check" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <button type="button" class="lang-item" data-lang="nl" role="menuitem">
        <span>Nederlands</span>
        <svg class="lang-check" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <button type="button" class="lang-item" data-lang="pt" role="menuitem">
        <span>Português</span>
        <svg class="lang-check" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <main class="conteneur-page" id="mainContainer">
    
    <!-- Logo officiel Bikelp -->
    <img 
      src="https://civilprom.s3.eu-north-1.amazonaws.com/Bikelp_ico_black.svg" 
      alt="Bikelp" 
      class="logo-bikelp"
    >

    <!-- Titre -->
    <h1 class="titre-page" id="textTitle">Bienvenue dans le peloton!</h1>

    <!-- Explication / Statut -->
    <p class="texte-description" id="textDesc">
      Votre adhésion à l'assurance est validée et votre vélo est désormais couvert. Vos documents contractuels ainsi que vos identifiants de connexion vous seront envoyés par mail dans quelques instants.
    </p>

    <!-- Liens d'actions -->
    <div class="zone-boutons">
      
      <!-- Lien vers l'espace client -->
      <a href="https://client.bikelp.com/" target="_blank" rel="noopener noreferrer" class="bouton-espace-client" id="btnClient">
        Connexion
      </a>

      <!-- Lien d'assistance par email -->
      <a href="mailto:support@bikelp.com" class="bouton-assistance" id="btnSupport">
        Assistance
      </a>

    </div>

  </main>

  <script>
    /* Dictionnaire des 6 langues avec les nouveaux textes actualisés */
    const translations = {
      fr: {
        label: 'Français',
        docTitle: 'Bienvenue dans le peloton! - Bikelp',
        title: 'Bienvenue dans le peloton!',
        desc: "Votre adhésion à l'assurance est validée et votre vélo est désormais couvert. Vos documents contractuels ainsi que vos identifiants de connexion vous seront envoyés par mail dans quelques instants.",
        btnClient: 'Connexion',
        btnSupport: 'Assistance'
      },
      en: {
        label: 'English',
        docTitle: 'Welcome to the pack! - Bikelp',
        title: 'Welcome to the peloton!',
        desc: 'Your insurance membership is confirmed and your bicycle is now covered. Your policy documents and login credentials will be emailed to you shortly.',
        btnClient: 'Log in',
        btnSupport: 'Support'
      },
      es: {
        label: 'Español',
        docTitle: '¡Bienvenido al pelotón! - Bikelp',
        title: '¡Bienvenido al pelotón!',
        desc: 'Tu suscripción al seguro ha sido validada y tu bicicleta ya está asegurada. Tus documentos contractuales y tus datos de acceso te serán enviados por correo en breves momentos.',
        btnClient: 'Iniciar sesión',
        btnSupport: 'Asistencia'
      },
      de: {
        label: 'Deutsch',
        docTitle: 'Willkommen im Peloton! - Bikelp',
        title: 'Willkommen im Peloton!',
        desc: 'Ihre Versicherungsanmeldung wurde bestätigt und Ihr Fahrrad ist ab sofort geschützt. Ihre Vertragsunterlagen sowie Ihre Zugangsdaten erhalten Sie in Kürze per E-Mail.',
        btnClient: 'Anmelden',
        btnSupport: 'Hilfe & Support'
      },
      nl: {
        label: 'Nederlands',
        docTitle: 'Welkom in het peloton! - Bikelp',
        title: 'Welkom in het peloton!',
        desc: 'Je verzekering is bevestigd en je fiets is vanaf nu gedekt. Je polisdocumenten en inloggegevens worden binnen enkele ogenblikken per e-mail naar je verzonden.',
        btnClient: 'Inloggen',
        btnSupport: 'Ondersteuning'
      },
      pt: {
        label: 'Português',
        docTitle: 'Bem-vindo ao pelotão! - Bikelp',
        title: 'Bem-vindo ao pelotão!',
        desc: 'A sua adesão ao seguro foi validada e a sua bicicleta está agora protegida. Os seus documentos contratuais e os seus dados de acesso ser-lhe-ão enviados por e-mail dentro de instantes.',
        btnClient: 'Iniciar sessão',
        btnSupport: 'Apoio ao cliente'
      }
    };

    /* Correspondance pays (ISO 2 lettres) -> langue */
    const countryToLang = {
      FR: 'fr', BE: 'fr', MC: 'fr', CH: 'fr', LU: 'fr', SN: 'fr', CI: 'fr',
      GB: 'en', US: 'en', CA: 'en', AU: 'en', IE: 'en', NZ: 'en',
      ES: 'es', MX: 'es', AR: 'es', CO: 'es', CL: 'es', PE: 'es',
      DE: 'de', AT: 'de',
      NL: 'nl',
      PT: 'pt', BR: 'pt', AO: 'pt', MZ: 'pt'
    };

    const container = document.getElementById('langSelectorContainer');
    const pillBtn = document.getElementById('langPillBtn');
    const currentLangLabel = document.getElementById('currentLangLabel');
    const items = document.querySelectorAll('.lang-item');

    /* Fonction d'application de la langue sur le DOM */
    function applyLanguage(lang) {
      if (!translations[lang]) lang = 'fr';

      const t = translations[lang];
      document.documentElement.lang = lang;
      document.getElementById('meta-title').textContent = t.docTitle;
      document.getElementById('textTitle').textContent = t.title;
      document.getElementById('textDesc').textContent = t.desc;
      document.getElementById('btnClient').textContent = t.btnClient;
      document.getElementById('btnSupport').textContent = t.btnSupport;
      currentLangLabel.textContent = t.label;

      items.forEach(btn => {
        if (btn.dataset.lang === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    /* Changement de langue par l'utilisateur */
    function setLanguage(lang, savePreference = true) {
      applyLanguage(lang);
      if (savePreference) {
        try {
          localStorage.setItem('bikelp_lang', lang);
        } catch (e) {
          /* Fallback local storage inaccessible */
        }
      }
    }

    /* Détection de la langue du navigateur */
    function getBrowserLanguage() {
      const navLang = (navigator.language || navigator.userLanguage || 'fr').toLowerCase();
      const code = navLang.slice(0, 2);
      if (['fr', 'en', 'es', 'de', 'nl', 'pt'].includes(code)) {
        return code;
      }
      return null;
    }

    /* Détection par Pays IP (fallback instantané sans blocage) */
    async function detectCountryLanguage() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000); // 2s max

        const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          const country = data.country_code || data.country;
          if (country && countryToLang[country.toUpperCase()]) {
            return countryToLang[country.toUpperCase()];
          }
        }
      } catch (err) {
        // En cas d'erreur ou d'adblock, passage silencieux
      }
      return null;
    }

    /* Initialisation au chargement */
    async function initLanguage() {
      // 1. Choix déjà mémorisé par l'utilisateur
      let savedLang = null;
      try {
        savedLang = localStorage.getItem('bikelp_lang');
      } catch (e) {}

      if (savedLang && translations[savedLang]) {
        applyLanguage(savedLang);
        return;
      }

      // 2. Détection par la langue du navigateur (très rapide et fiable pour la device)
      const browserLang = getBrowserLanguage();
      if (browserLang) {
        setLanguage(browserLang, false);
      }

      // 3. Détection par géolocalisation IP en arrière-plan pour affiner selon le pays de connexion
      const detectedCountryLang = await detectCountryLanguage();
      // Si l'utilisateur n'a pas sélectionné manuellement entre-temps
      const isStillDefault = !localStorage.getItem('bikelp_lang');
      if (isStillDefault && detectedCountryLang) {
        setLanguage(detectedCountryLang, false);
      }
    }

    // Gestion du menu déroulant gélule
    pillBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = container.classList.toggle('open');
      pillBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    items.forEach(button => {
      button.addEventListener('click', (e) => {
        const lang = button.getAttribute('data-lang');
        setLanguage(lang, true);
        container.classList.remove('open');
        pillBtn.setAttribute('aria-expanded', 'false');
      });
    });

    // Fermeture lors d'un clic extérieur
    document.addEventListener('click', (e) => {
      if (!container.contains(e.target)) {
        container.classList.remove('open');
        pillBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Fermeture avec la touche Échap
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        container.classList.remove('open');
        pillBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Lancement
    initLanguage();
  </script>

</body>
</html>
